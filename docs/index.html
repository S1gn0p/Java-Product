<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>拉马努金公式圆周率计算器</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
        }

        /* 新增：GitHub 链接样式 */
        .github-link {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #333;
            font-weight: 600;
            font-size: 16px;
            padding: 8px 16px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }
        .github-link:hover {
            color: #007bff;
            box-shadow: 0 4px 12px rgba(0,123,255,0.2);
            transform: translateY(-1px);
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="number"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #status {
            color: #666;
            margin-bottom: 15px;
            font-size: 14px;
        }
        #result {
            white-space: pre-wrap;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #eee;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<!-- 新增：左上角 GitHub 链接 -->
<a href="https://github.com/S1gn0p" target="_blank" class="github-link">
    <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
    </svg>
    My GitHub
</a>

<div class="container">
    <h1>🧮 拉马努金公式圆周率计算器</h1>
    <div class="input-group">
        <input type="number" id="precision" value="1000" min="1" placeholder="输入精度 (例如 1000)">
        <button id="calculateBtn">开始计算</button>
    </div>
    <div id="status"></div>
    <div id="result"></div>
</div>

<script src="js/pi.js"></script>
<script>
    document.getElementById('calculateBtn').addEventListener('click', function() {
        const precisionInput = document.getElementById('precision');
        const precision = parseInt(precisionInput.value, 10);
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const btn = this;

        if (isNaN(precision) || precision <= 0) {
            alert('请输入有效的正整数精度！');
            return;
        }

        btn.disabled = true;
        statusDiv.textContent = '正在计算中，请稍候...';
        resultDiv.textContent = '';

        setTimeout(() => {
            try {
                const piValue = window.calculatePi(precision);
                resultDiv.textContent = piValue;
                statusDiv.textContent = `计算完成！精度：小数点后 ${precision} 位`;
            } catch (e) {
                statusDiv.textContent = '计算出错：' + e.message;
                console.error(e);
            } finally {
                btn.disabled = false;
            }
        }, 50);
    });
</script>
</body>
</html>
