<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小游戏合集</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        h1 {
            color: white;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            max-width: 1000px;
            width: 100%;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px 20px;
            text-decoration: none;
            color: #333;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }
        .icon { font-size: 3em; }
        .name { font-size: 1.3em; font-weight: 700; }
        .desc { font-size: 0.9em; color: #666; }
        .github-link {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            padding: 8px 16px;
            background: rgba(0,0,0,0.3);
            border-radius: 30px;
            transition: all 0.2s ease;
        }
        .github-link:hover {
            background: rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
<a href="https://github.com/S1gn0p" target="_blank" class="github-link">
    <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
    </svg>
    My GitHub
</a>
<h1>🎮 小游戏合集</h1>
<div class="grid">
    <a href="js/pi.html" class="card">
        <div class="icon">🧮</div>
        <div class="name">圆周率计算</div>
        <div class="desc">拉马努金公式计算圆周率任意精度</div>
    </a>
    <a href="minesweeper/" class="card">
        <div class="icon">💣</div>
        <div class="name">扫雷</div>
        <div class="desc">经典 Windows XP 扫雷</div>
    </a>
    <a href="surf/" class="card">
        <div class="icon">🌊</div>
        <div class="name">网上冲浪</div>
        <div class="desc">Edge 冲浪游戏</div>
    </a>
    <a href="dino/" class="card">
        <div class="icon">🦖</div>
        <div class="name">恐龙快跑</div>
        <div class="desc">Chrome 断网恐龙</div>
    </a>
    <a href="tetris/" class="card">
        <div class="icon">🧱</div>
        <div class="name">俄罗斯方块</div>
        <div class="desc">带道具的现代俄罗斯方块</div>
    </a>
    <a href="ide/" class="card">
        <div class="icon">💻</div>
        <div class="name">网页 IDE</div>
        <div class="desc">多语言在线代码编辑器</div>
    </a>
</div>
</body>
</html>
