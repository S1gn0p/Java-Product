<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在线代码编辑器</title>
<link rel="stylesheet" href="./monaco-vs/editor/editor.main.css">
<style>
:root{
  --background:0 0% 100%;
  --foreground:220 15% 20%;
  --primary:220 90% 56%;
  --primary-foreground:0 0% 100%;
  --muted:220 15% 96%;
  --muted-foreground:220 9% 46%;
  --border:220 13% 88%;
}
html.dark{
  --background:220 15% 10%;
  --foreground:0 0% 100%;
  --primary:220 90% 56%;
  --primary-foreground:0 0% 100%;
  --muted:220 15% 17%;
  --muted-foreground:220 9% 65%;
  --border:220 13% 25%;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:hsl(var(--background));
  color:hsl(var(--foreground));
  height:100vh;display:flex;flex-direction:column;overflow:hidden;
}
header{
  height:56px;flex-shrink:0;display:flex;align-items:center;
  padding:0 20px;border-bottom:1px solid hsl(var(--border));
}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.brand svg{width:24px;height:24px}
.spacer{flex:1}
.headlink{
  font-size:14px;font-weight:500;color:hsl(var(--foreground));
  text-decoration:none;padding:6px 12px;border-radius:6px;
}
.headlink:hover{background:hsl(var(--muted))}
main{flex:1;display:flex;flex-direction:column;padding:24px;gap:16px;min-height:0}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
.sub{color:hsl(var(--muted-foreground));font-size:15px;margin-top:6px}
.bar{display:flex;align-items:center;gap:12px}
select{
  height:36px;padding:0 12px;font-size:14px;font-family:inherit;
  color:hsl(var(--foreground));background:transparent;
  border:1px solid hsl(var(--border));border-radius:6px;
  cursor:pointer;min-width:210px;
}
.btn{
  height:36px;display:inline-flex;align-items:center;gap:8px;
  padding:0 16px;font-size:14px;font-weight:500;font-family:inherit;
  color:hsl(var(--foreground));background:transparent;
  border:1px solid hsl(var(--border));border-radius:6px;cursor:pointer;
}
.btn:hover{background:hsl(var(--muted))}
.btn svg{width:16px;height:16px}
.run{color:hsl(var(--primary-foreground));background:hsl(var(--primary));border-color:hsl(var(--primary))}
.run:hover{background:hsl(var(--primary)/.9)}
.iconbtn{
  width:36px;height:36px;display:inline-flex;align-items:center;
  justify-content:center;padding:0;color:hsl(var(--foreground));
  background:transparent;border:1px solid hsl(var(--border));
  border-radius:6px;cursor:pointer;
}
.iconbtn:hover{background:hsl(var(--muted))}
.iconbtn svg{width:18px;height:18px}
.moon{display:none}
html.dark .sun{display:none}
html.dark .moon{display:block}
.panes{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:0}
.pane{
  border:1px solid hsl(var(--border));border-radius:8px;
  overflow:hidden;display:flex;flex-direction:column;min-height:0;
  position:relative;
}
.pane.out{background:hsl(var(--muted));padding:16px}
.pane h2{
  font-size:14px;font-weight:400;color:hsl(var(--muted-foreground));
  height:41px;display:flex;align-items:center;flex-shrink:0;
  padding:0 16px;border-bottom:1px solid hsl(var(--border));
}
.pane.out h2{padding:0 0 8px;border:none}
#editor{position:absolute;top:41px;left:0;right:0;bottom:0}
#boot{
  height:100%;display:flex;align-items:center;justify-content:center;
  color:hsl(var(--muted-foreground));font-size:14px;padding:20px;text-align:center;
}
#out{
  flex:1;margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;
  overflow:auto;
}
#out .err{color:#ef4444}
#out .dim{color:hsl(var(--muted-foreground))}
footer{
  flex-shrink:0;border-top:1px solid hsl(var(--border));padding:16px 24px;
  display:flex;align-items:center;gap:16px;font-size:14px;
  color:hsl(var(--muted-foreground));
}
footer a{color:hsl(var(--muted-foreground));text-decoration:none;display:flex}
footer svg{width:20px;height:20px}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/>
    </svg>
    <span>CodeCraft IDE</span>
  </div>
  <div class="spacer"></div>
  <nav style="display:flex;gap:4px">
    <a class="headlink" href="../index.html">返回首页</a>
    <a class="headlink" href="./docs.html">文档</a>
  </nav>
</header>

<main>
  <div>
    <h1>在线代码编辑器</h1>
    <p class="sub">编写并运行 Python 代码，全部在浏览器中完成。</p>
  </div>

  <div class="bar">
    <select id="ver">
      <option value="3.12.1">Python 3.12.1</option>
      <option value="other">其他版本（暂不支持）</option>
    </select>
    <button class="btn run" id="run">
      <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
      运行
    </button>
    <div class="spacer"></div>
    <button class="iconbtn" id="theme" title="切换主题">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/>
        <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
        <path d="M2 12h2"/><path d="M20 12h2"/>
        <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
      </svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
      </svg>
    </button>
  </div>

<div class="panes">
    <div class="pane">
      <h2>编辑器</h2>
      <div id="editor"><div id="boot">正在加载编辑器…</div></div>
    </div>
    <div class="pane out">
      <h2>输出:</h2>
      <pre id="out">就绪。</pre>
    </div>
  </div>
</main>

<footer>
  <div class="brand" style="font-size:14px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/>
    </svg>
    <span>CodeCraft IDE</span>
  </div>
  <span>现代化的 Python 在线 IDE，专为开发者打造。</span>
  <div class="spacer"></div>
  <a href="https://github.com" target="_blank" rel="noreferrer" title="GitHub">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
      <path d="M9 18c-4.51 2-5-2-7-2"/>
    </svg>
  </a>
  <span>© <span id="year"></span> CodeCraft IDE. 保留所有权利。</span>
</footer>

<script src="./pyodide/pyodide.js"></script>
<script src="./monaco-vs/loader.js"></script>
<script>
const out = document.getElementById('out');
const put = (t, cls) => {
  const s = document.createElement('span');
  if (cls) s.className = cls;
  s.textContent = t;
  out.appendChild(s);
};

let py = null, busy = false, editor = null;

if (localStorage.theme === 'dark' ||
    (!localStorage.theme && matchMedia('(prefers-color-scheme: dark)').matches))
  document.documentElement.classList.add('dark');

async function boot() {
  if (py) return;
  put('正在加载 Python 运行时（首次约需 14MB）...\n', 'dim');
  py = await loadPyodide({
    indexURL: location.pathname.replace(/\/[^/]*$/, '/') + 'pyodide/'
  });
  py.setStdout({ batched: t => put(t) });
  py.setStderr({ batched: t => put(t, 'err') });
  put('Python ' + py.runPython('import sys; sys.version.split()[0]') + ' 就绪。\n', 'dim');
}

document.getElementById('run').onclick = async () => {
  if (busy) return;
  busy = true;
  out.textContent = '';
  try {
    await boot();
    put('\n');
    await py.runPythonAsync(editor.getValue());
  } catch (e) {
    put(String(e.message || e) + '\n', 'err');
  } finally {
    busy = false;
  }
};

const base = location.pathname.replace(/\/[^/]*$/, '/') + 'monaco-vs/';
require.config({ paths: { vs: base } });
require(['vs/editor/editor.main'], function () {
  const monaco = window.monaco;
  try {
    monaco.editor.defineTheme('cc', {
      base: 'vs', inherit: true, rules: [],
      colors: { 'editor.background': '#ffffff' }
    });
    monaco.editor.defineTheme('cc-dark', {
      base: 'vs-dark', inherit: true, rules: [],
      colors: { 'editor.background': '#171719' }
    });
    editor = monaco.editor.create(document.getElementById('editor'), {
      value: 'print("Hello, World!")',
      language: 'python',
      theme: document.documentElement.classList.contains('dark') ? 'cc-dark' : 'cc',
      fontSize: 14,
      minimap: { enabled: false },
      scrollBeyondLastLine: false,
      automaticLayout: true,
      padding: { top: 12 }
    });
    const b = document.getElementById('boot');
    if (b) b.remove();
  } catch (err) {
    const b = document.getElementById('boot');
    if (b) b.textContent = '编辑器初始化失败：' + err.message;
  }
}, function (e) {
  const b = document.getElementById('boot');
  if (b) b.textContent = '编辑器加载失败：' + (e && e.message ? e.message : e);
});

document.getElementById('theme').onclick = () => {
  const d = document.documentElement.classList.toggle('dark');
  localStorage.theme = d ? 'dark' : 'light';
  if (window.monaco) {
    window.monaco.editor.setTheme(d ? 'cc-dark' : 'cc');
  }
};
document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
