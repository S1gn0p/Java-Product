<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>拉马努金公式圆周率计算器</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
        }
        h1 { color: #333; text-align: center; margin-bottom: 20px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #007bff; text-decoration: none; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="number"] { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { padding: 12px 24px; background-color: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { color: #666; margin-bottom: 15px; font-size: 14px; }
        #result { white-space: pre-wrap; word-break: break-all; font-family: 'Courier New', monospace; background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #eee; max-height: 400px; overflow-y: auto; line-height: 1.6; }
    </style>
</head>
<body>
<div class="container">
    <a href="../index.html" class="back-link">← 返回首页</a>
    <h1>🧮 拉马努金公式圆周率计算器</h1>
    <div class="input-group">
        <input type="number" id="precision" value="1000" min="1" placeholder="输入精度 (例如 1000)">
        <button id="calculateBtn">开始计算</button>
    </div>
    <div id="status"></div>
    <div id="result"></div>
</div>
<script src="pi.js"></script>
<script>
    document.getElementById('calculateBtn').addEventListener('click', function() {
        const precisionInput = document.getElementById('precision');
        const precision = parseInt(precisionInput.value, 10);
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const btn = this;
        if (isNaN(precision) || precision <= 0) { alert('请输入有效的正整数精度！'); return; }
        btn.disabled = true;
        statusDiv.textContent = '正在计算中，请稍候...';
        resultDiv.textContent = '';
        setTimeout(() => {
            try {
                const piValue = window.calculatePi(precision);
                resultDiv.textContent = piValue;
                statusDiv.textContent = `计算完成！精度：小数点后 ${precision} 位`;
            } catch (e) {
                statusDiv.textContent = '计算出错：' + e.message;
                console.error(e);
            } finally {
                btn.disabled = false;
            }
        }, 50);
    });
</script>
</body>
</html>
